<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <section>
            <header>
                <h2>
                    <h:outputText value="#{translation.get('chat')}"/>
                </h2>
            </header>

            <div class="container">
                <div class="row mb-3">

                    <!-- Panel wiadomości - opakowany w formę, żeby AJAX mogło go renderować -->
                    <h:form id="chatForm">

                        <h:panelGroup id="chatPanel" layout="block" styleClass="col-8">
                            <div class="card">
                                <div class="card-header">Wiadomości</div>
                                <div class="card-body">
                                    <div id="chatMessages"
                                         style="height:400px; overflow:auto; white-space:pre-wrap;"></div>
                                </div>
                            </div>
                        </h:panelGroup>

                        <div class="col-4">
                            <div class="card">
                                <div class="card-header">
                                    <h:outputText value="#{translation.get('chat.message.send')}"/>
                                </div>
                                <div class="card-body">
                                    <div class="mb-2">
                                        <label for="toInput">
                                            <h:outputText value="#{translation.get('chat.message.to')}"/>
                                        </label>
                                        <h:inputText id="toInput"
                                                     value="#{chatBean.to}"
                                                     placeholder="#{translation.get('chat.message.toUser', 'Użytkownik (puste = wszyscy)')}"
                                                     style="width:100%"/>
                                    </div>

                                    <div class="mb-2">
                                        <label for="msg">Wiadomość:</label>
                                        <h:inputTextarea id="msg" value="#{chatBean.message}" rows="4"
                                                         style="width:100%"/>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <h:commandButton value="#{translation.get('chat.message.send')}"
                                                         action="#{chatBean.send}">
                                            <f:ajax execute="@form" render="chatPanel"/>
                                        </h:commandButton>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </h:form>
                </div>
            </div>
        </section>
    </ui:define>

</ui:composition>
