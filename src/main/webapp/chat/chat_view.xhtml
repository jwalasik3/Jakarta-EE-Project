<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <section>
            <header class="mb-4">
                <h2>
                    <h:outputText value="#{translation.get('chat')}" />
                </h2>
            </header>

            <div class="container">
                <div class="row">

                    <!-- Panel wiadomości -->
                    <div class="col-md-8 mb-3">
                        <div class="card h-100">
                            <div class="card-header">
                                <h:outputText value="#{translation.get('chat.messages')}" />
                            </div>
                            <div class="card-body p-2" style="height: 400px; overflow-y: auto; white-space: pre-wrap;">
                                <div id="chatMessages"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Panel wysyłania wiadomości -->
                    <div class="col-md-4 mb-3">
                        <div class="card h-100">
                            <div class="card-header">
                                <h:outputText value="#{translation.get('chat.sendMessage')}" />
                            </div>
                            <div class="card-body">
                                <h:form id="chatForm">
                                    <div class="mb-2">
                                        <h:outputLabel for="toInput" value="#{translation.get('chat.to')}" />
                                        <h:inputText id="toInput"
                                                     value="#{chatBean.to}"
                                                     placeholder="#{translation.get('chat.toUserPlaceholder', 'Użytkownik (puste = wszyscy)')}"
                                                     style="width: 100%;" />
                                    </div>

                                    <div class="mb-2">
                                        <h:outputLabel for="msg" value="#{translation.get('chat.message')}" />
                                        <h:inputTextarea id="msg"
                                                         value="#{chatBean.message}"
                                                         rows="4"
                                                         style="width: 100%;" />
                                    </div>

                                    <div class="d-grid">
                                        <h:commandButton value="#{translation.get('chat.send')}"
                                                         action="#{chatBean.send}"
                                                         styleClass="btn btn-primary">
                                            <f:ajax execute="@form"/>
                                        </h:commandButton>
                                    </div>
                                </h:form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </ui:define>

</ui:composition>
