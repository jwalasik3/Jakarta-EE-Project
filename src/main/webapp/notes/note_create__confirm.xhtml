<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{noteCreate.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Create note - basic information</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn" value="Previous" immediate="true"
                                         action="#{noteCreate.goToThreadAction()}"/>
                    </div>
                    <div class="col-2 p-2 text-center">
                        <h:button styleClass="btn" value="Next" disabled="true"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4">
                        <div class="row mb-2">
                            <div class="col-6">
                                Level &amp; Profession
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{characterCreate.character.profession.name}"/>
                                level
                                <h:outputText value="#{characterCreate.character.level}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Experience
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{characterCreate.character.experience}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Life
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{characterCreate.character.health}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Strength
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{characterCreate.character.strength}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Constitution
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{characterCreate.character.constitution}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Charisma
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{characterCreate.character.charisma}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Age
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{characterCreate.character.age}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Background
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{characterCreate.character.background}"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-primary" value="Create"
                                         action="#{characterCreate.saveAction()}"/>
                    </div>
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-secondary" value="Cancel"
                                         action="#{characterCreate.cancelAction()}"/>
                    </div>
                </div>
            </h:form>
        </article>
    </ui:define>

</ui:composition>
