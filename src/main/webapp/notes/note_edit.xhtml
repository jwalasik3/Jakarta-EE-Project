<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{noteEdit.id}" required="true"/>
        <f:viewAction action="#{noteEdit.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Edit note info</h2></header>
            <h:form styleClass="container" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-4 p-2">
                        <h:messages/>
                    </div>
                </div>

                <h:inputHidden value="#{noteEdit.note.version}" />
                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:inputText id="title" value="#{noteEdit.note.title}" styleClass="form-control">
                                <f:ajax event="blur" listener="#{noteEdit.onFieldChanged}" execute="@this" render="@this">
                                    <f:attribute name="fieldName" value="title"/>
                                </f:ajax>
                                <h:outputLabel for="title" value="Title:" styleClass="form-label"/>
                            </h:inputText>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:inputText id="content" value="#{noteEdit.note.content}" styleClass="form-control">
                                <f:ajax event="blur" listener="#{noteEdit.onFieldChanged}" execute="@this" render="@this">
                                    <f:attribute name="fieldName" value="content"/>
                                </f:ajax>
                                <h:outputLabel for="content" value="Content:" styleClass="form-label"/>
                            </h:inputText>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-primary" value="Update"
                                         action="#{noteEdit.saveAction()}"/>
                    </div>
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-secondary" type="reset" value="Reset"/>
                    </div>
                </div>
            </h:form>
        </article>
    </ui:define>

</ui:composition>
