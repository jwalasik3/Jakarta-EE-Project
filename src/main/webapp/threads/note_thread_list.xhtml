<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <h:outputStylesheet library="note_thread" name="css/note_thread_list.css"/><!-- Automatically relocated to head. -->

        <article class="text--justified">
            <header><h2>Threads</h2></header>

            <h:dataTable value="#{threadsModel.thread}" var="thread"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                <h:column>
                    <f:facet name="header">Name</f:facet>
                    <h:outputText value="#{thread.title}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Edit</f:facet>
                    <h:link outcome="/note_thread/note_thread_edit.xhtml" value="Edit">
                        <f:param name="id" value="#{thread.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Delete</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="Delete"
                                         action="#{threadsList.deleteAction(note)}"/>
                    </h:form>
                </h:column>

                <f:facet name="footer">
                    <h:button styleClass="btn" outcome="/note/note_create_basic.xhtml"
                              value="Create new note"/>
                </f:facet>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
