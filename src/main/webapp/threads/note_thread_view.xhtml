<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{threadView.id}" required="true"/>
        <f:viewAction action="#{threadView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2><h:outputText value="#{threadView.noteThread.title}"/></h2></header>
            <div class="container">
                <div class="row">
                    <div class="col-4">

                        <div class="row mb-2">
                            <div class="col-6">
                                #{translation.get('importance')}:
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{threadView.noteThread.importance}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                #{translation.get('notes')}:
                            </div>
                            <div class="col-6">
                                <h:form id="notesForm">
                                    <h:dataTable value="#{threadView.noteThread.notes}" var="note" id="notesTable"
                                                 styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                                        <h:column>
                                            <f:facet name="header">#{translation.get('title')}</f:facet>
                                            <h:outputText value="#{note.title}"/>
                                        </h:column>

                                        <h:column>
                                            <f:facet name="header">#{translation.get('view')}</f:facet>
                                            <h:link outcome="/notes/note_view.xhtml" value="#{translation.get('view')}">
                                                <f:param name="id" value="#{note.id}"/>
                                            </h:link>
                                        </h:column>

                                        <h:column>
                                            <f:facet name="header">#{translation.get('delete')}</f:facet>
                                            <h:commandButton styleClass="btn" value="#{translation.get('delete')}"
                                                             action="#{threadView.deleteAction(note.id)}">
                                                <f:ajax execute="@this" render="notesTable"/>
                                            </h:commandButton>
                                        </h:column>

                                        <f:facet name="footer">
                                            <h:button styleClass="btn" outcome="/notes/note_create_basic.xhtml"
                                                      value="#{translation.get('create')}"/>
                                        </f:facet>
                                    </h:dataTable>
                                </h:form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </article>
    </ui:define>

</ui:composition>
