<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{threadView.id}" required="true" converter="jakarta.faces.UuidConverter"/>
        <f:viewAction action="#{threadView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2><h:outputText value="#{threadView.noteThread.title}"/></h2></header>
            <div class="container">
                <div class="row">
                    <div class="col-4">

                        <div class="row mb-2">
                            <div class="col-6">
                                Importance:
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{threadView.noteThread.importance}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                Notes:
                            </div>
                            <div class="col-6">
                                <h:dataTable value="#{threadView.noteThread.notes}" var="note"
                                             styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                                    <h:column>
                                        <f:facet name="header">Title</f:facet>
                                        <h:outputText value="#{note.title}"/>
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">View</f:facet>
                                        <h:link outcome="/notes/note_view.xhtml" value="View">
                                            <f:param name="id" value="#{note.id}"/>
                                        </h:link>
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Edit</f:facet>
                                        <h:link outcome="/notes/note_edit.xhtml" value="Edit">
                                            <f:param name="id" value="#{note.id}"/>
                                        </h:link>
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Delete</f:facet>
                                        <h:form>
                                            <h:commandButton styleClass="btn" value="Delete"
                                                             action="#{threadView.deleteAction(note.id)}"/>
                                        </h:form>
                                    </h:column>

                                    <f:facet name="footer">
                                        <h:button styleClass="btn" outcome="/notes/note_create_basic.xhtml"
                                                  value="Create new note"/>
                                    </f:facet>
                                </h:dataTable>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </article>
    </ui:define>

</ui:composition>
